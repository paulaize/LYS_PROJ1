# v1 real test animal config.
# Keep unknown scientific facts null until Paul confirms them in QuPath/QC.

animal_id: "BD_08_5D"
timepoint: "5d"
group: "stroke"

source_ids:
  mri_subject: "JD_BD_08_2_D5"

mri:
  has_mri: true
  bruker_study: "data/5D/MRI/20251123_175503_JD_BD_08_2_D5_MRI_D5"
  t2_scan_id: 2
  t2_reco_id: 1
  t2_nifti: "work/BD_08_5D/mri/t2_scan2.nii.gz"
  t2star_nifti: null
  tof_nifti: null
  lesion_side: "image_right"

ihc:
  section_thickness_um: 10
  section_spacing_um: null
  panel_section_matching: "unconfirmed_do_not_match_by_section_id"
  ipsilateral_side_in_image: "right"
  contralateral_side_in_image: "left"
  orientation_qc_status: "pending_visual_qc"
  threshold_controls:
    - animal_id: "C6S5"
      role: "no_lys241_control"
      config: "config/animals/C6S5.yml"
      notes: >
        Control IHC animal supplied by Paul for first IgG-FITC threshold
        calibration. MRI is not required for this control in v1.
  qupath:
    tissue_annotation_name: "tissue_v1"
    artifact_exclusion_annotation_names: ["artifact_exclude"]
    combined_csv_mode: "overwrite"
    series_index_base: 0
    label_series_index: 0
    overview_series_index: 1
    section_series_indices: [2, 3, 4, 5, 6, 7, 8, 9]
    section_ids_by_series_index:
      2: "section_01"
      3: "section_02"
      4: "section_03"
      5: "section_04"
      6: "section_05"
      7: "section_06"
      8: "section_07"
      9: "section_08"
    slide_row_major_section_ids:
      - "section_04"
      - "section_03"
      - "section_02"
      - "section_01"
      - "section_08"
      - "section_07"
      - "section_06"
      - "section_05"
    section_selection_policy: "manual_qc_select_best_sections"
    selected_section_ids: []
    excluded_section_ids: []
    notes: >
      Each VSI has 10 QuPath/Bio-Formats images: label, whole-slide overview,
      then 8 separate 10 um brain-section images. Process section series only.
      Sections can be filtered later for tears/folds before quantification.
      Panel A and Panel B section IDs are not assumed to be matched.
  igg_fitc_threshold_status: "pending_vehicle_control_calibration"
  panels:
    A:
      vsi_dir: "data/5D/IHC/panel_A"
      vsi_files:
        - "data/5D/IHC/panel_A/BD_08_5D Podo NeuroT IgG___01.vsi"
      overview_vsi: null
      section_selection:
        status: "selected_by_visual_qc"
        selection_source: "Paul visual QC (2026-07-08)"
        selected_section_ids: ["section_01", "section_03", "section_06"]
        excluded_section_ids:
          - "section_02"
          - "section_04"
          - "section_05"
          - "section_07"
          - "section_08"
        notes: >
          Best Panel A sections selected by Paul: section_01, section_03, and
          approximately section_06. Section_06 should be treated as usable with
          visual-QC caution. Section_08 opened as a macro/non-tissue series in
          section QC.
      channel_map:
        0: "DAPI"
        1: "IgG-FITC"
        2: "Podocalyxin"
        3: "NeuroTrace"
      raw_channel_names:
        0: "C1 DAPI"
        1: "C2 FITC"
        2: "C3 CY3"
        3: "C4 CY5"
      neurotrace_emission: "640/660 Deep-Red Fluorescent Nissl Stain"
      neurotrace_emission_confirmed: true
      neurotrace_emission_source: "accepted_for_v1_by_Paul (2026-06-17)"
      igg_fitc_channel_index: 1
      igg_fitc_positive_threshold: null
      fitc_spectral_bleedthrough: "none"
    B:
      vsi_dir: "data/5D/IHC/panel_B"
      vsi_files:
        - "data/5D/IHC/panel_B/BD_08_5D IBA1 GFAP IgG_01.vsi"
      overview_vsi: null
      section_selection:
        status: "selected_by_visual_qc"
        selection_source: "Paul visual QC (2026-07-08)"
        selected_section_ids: ["section_05", "section_06", "section_08"]
        excluded_section_ids:
          - "section_01"
          - "section_02"
          - "section_03"
          - "section_04"
          - "section_07"
        notes: >
          Best available Panel B sections selected by Paul are section_05,
          section_06, and section_08, although all Panel B sections are
          imperfect. Section_04 and section_07 are excluded because Paul
          confirmed those images were not saved properly.
      channel_map:
        0: "DAPI"
        1: "IgG-FITC"
        2: "GFAP"
        3: "IBA1"
      raw_channel_names:
        0: "C1 DAPI"
        1: "C2 FITC"
        2: "C3 CY3"
        3: "C4 CY5"
      igg_fitc_channel_index: 1
      igg_fitc_positive_threshold: null
      fitc_spectral_bleedthrough: "none"

interpretation_flags:
  anti_igg_specificity_resolved: true
  fitc_specific_to_lys241: true
  specificity_source: "confirmed_anti_human_IgG (Paul, 2026-06-17)"
  fitc_igg_specificity: "anti_human_confirmed"
  anti_igg_specificity_note: >
    The anti-IgG-FITC secondary is confirmed as anti-human IgG. LYS241 is
    humanized Glunomab, so this secondary targets LYS241 and does not bind
    endogenous mouse IgG. This resolves the biological endogenous-IgG leakage
    confound, but not the positivity threshold.
