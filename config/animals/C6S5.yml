      vsi_dir: "data/C6S5/IHC/panel_A"
      vsi_files:
        - "data/C6S5/IHC/panel_A/BD_08_C6S5 C-_01.vsi"
      overview_vsi: null
      channel_map:
        0: "DAPI"
        1: "IgG-FITC"
