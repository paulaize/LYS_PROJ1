# v1 IHC control animal config.
# MRI is intentionally absent for now; this animal is used as an IHC threshold
# control for BD_08_5D.

animal_id: "C6S5"
timepoint: null
group: "control"

mri:
  has_mri: false
  bruker_study: null
  t2_scan_id: null
  t2_reco_id: null
  t2_nifti: null
  t2star_nifti: null
  tof_nifti: null
  lesion_side: null

ihc:
  control_role: "no_lys241_control"
  section_thickness_um: 10
  section_spacing_um: null
  panel_section_matching: "unconfirmed_do_not_match_by_section_id"
  ipsilateral_side_in_image: null
  contralateral_side_in_image: null
  orientation_qc_status: "not_applicable_control"
  qupath:
    tissue_annotation_name: "tissue_v1"
    artifact_exclusion_annotation_names: ["artifact_exclude"]
    combined_csv_mode: "overwrite"
    series_index_base: 0
    label_series_index: 0
    overview_series_index: 1
    section_series_indices: [2, 3, 4, 5, 6, 7, 8, 9]
    section_ids_by_series_index:
      2: "section_01"
      3: "section_02"
      4: "section_03"
      5: "section_04"
      6: "section_05"
      7: "section_06"
      8: "section_07"
      9: "section_08"
    section_selection_policy: "manual_qc_select_best_sections"
    selected_section_ids: []
    excluded_section_ids: []
    notes: >
      Control IHC files follow the same v1 QuPath/Bio-Formats series convention
      as BD_08_5D: label, whole-slide overview, then 8 section images. Panel A
      and Panel B section IDs are not assumed to be matched.
  igg_fitc_threshold_status: "pending_control_calibration"
  panels:
    A:
      vsi_dir: "data/C6S5/IHC/panel_A"
      vsi_files:
        - "data/C6S5/IHC/panel_A/BD_08_C6S5 C-_01.vsi"
      source_bundles:
        - vsi_file: "data/C6S5/IHC/panel_A/BD_08_C6S5 C-_01.vsi"
          companion_dir: "data/C6S5/IHC/panel_A/_BD_08_C6S5 C-_01_"
      overview_vsi: null
      section_selection:
        status: "selected_by_visual_qc"
        selection_source: "Paul visual QC (2026-07-08)"
        selected_section_ids: ["section_05", "section_06", "section_07"]
        excluded_section_ids:
          - "section_01"
          - "section_02"
          - "section_03"
          - "section_04"
          - "section_08"
        notes: >
          Good no-LYS241 control Panel A sections selected by Paul:
          section_05, section_06, and section_07. Earlier section_01 outputs
          were smoke-test artifacts only because the section is visibly damaged.
      channel_map:
        0: "DAPI"
        1: "IgG-FITC"
        2: "Podocalyxin"
        3: "NeuroTrace"
      raw_channel_names:
        0: "C1 DAPI"
        1: "C2 FITC"
        2: "C3 CY3"
        3: "C4 CY5"
      channel_map_source: "same_panel_acquisition_as_BD_08_5D; verify in QuPath before final sign-off"
      neurotrace_emission: "640/660 Deep-Red Fluorescent Nissl Stain"
      neurotrace_emission_confirmed: true
      neurotrace_emission_source: "accepted_for_v1_by_Paul (2026-06-17)"
      igg_fitc_channel_index: 1
      igg_fitc_positive_threshold: null
      fitc_spectral_bleedthrough: "none"
    B:
      vsi_dir: "data/C6S5/IHC/panel_B"
      vsi_files:
        - "data/C6S5/IHC/panel_B/BD_08_C6S5 C- IBA1 GFAP IgG_01.vsi"
      source_bundles:
        - vsi_file: "data/C6S5/IHC/panel_B/BD_08_C6S5 C- IBA1 GFAP IgG_01.vsi"
          companion_dir: "data/C6S5/IHC/panel_B/_BD_08_C6S5 C- IBA1 GFAP IgG_01_"
      overview_vsi: null
      control_status: "available_pending_visual_qc"
      exclude_from_threshold_calibration: false
      section_selection:
        status: "available_pending_visual_qc"
        selection_source: "QuPath 0.7/Bio-Formats technical diagnostic (2026-07-22)"
        selected_section_ids: []
        excluded_section_ids: []
        exploratory_control_selection_status: "technical_open_only_unreviewed"
        notes: >
          Updated source bundle verified with QuPath 0.7/Bio-Formats on
          2026-07-22. Series 2-9 open as section_01-section_08 with four
          channels, approximately 0.325 um/pixel, and valid IgG-FITC channel
          index 1. Exploratory calibration may use metadata-valid sections
          that complete pixel reading, labeled technical_open_only_unreviewed.
          Human section selection and visual QC remain pending.
      channel_map:
        0: "DAPI"
        1: "IgG-FITC"
        2: "GFAP"
        3: "IBA1"
      raw_channel_names:
        0: "C1 DAPI"
        1: "C2 FITC"
        2: "C3 CY3"
        3: "C4 CY5"
      channel_map_source: "same_panel_acquisition_as_BD_08_5D; verify in QuPath before final sign-off"
      igg_fitc_channel_index: 1
      igg_fitc_positive_threshold: null
      fitc_spectral_bleedthrough: "none"

interpretation_flags:
  anti_igg_specificity_resolved: true
  fitc_specific_to_lys241: true
  specificity_source: "confirmed_anti_human_IgG (Paul, 2026-06-17)"
  fitc_igg_specificity: "anti_human_confirmed"
  anti_igg_specificity_note: >
    Control animal for background/threshold calibration. The anti-human
    IgG-FITC secondary should not generate specific signal in no-LYS241 control
    tissue; final threshold still requires calibration and review.
