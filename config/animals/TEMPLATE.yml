# Per-animal config. Copy to config/animals/<id>.yml and fill every TODO/null.
# No paths, channel maps, or thresholds should be hardcoded in Python/Groovy.

animal_id: "TEMPLATE"          # e.g. "M07"
timepoint: null                # one of: 1h, 3h, 6h, 24h, 48h, 5d
group: "stroke"                # stroke/control/etc.

mri:
  # MRI exists ONLY for 24h / 48h / 5d animals. For 1h/3h/6h set has_mri: false.
  has_mri: true
  bruker_study: null            # TODO: raw Bruker study folder, read-only under data/ or /Volumes
  t2_scan_id: 2                 # T2 RARE Scan 2; change only if metadata proves otherwise
  t2_reco_id: 1                 # MAGNITUDE_IMAGE reco
  t2_nifti: null               # TODO: T2 RARE Scan 2 NIfTI from brkraw
  t2star_nifti: null           # optional Scan 3 T2*
  tof_nifti: null              # optional Scan 4 TOF
  lesion_side: "image_right"   # v1 stroke default: lesion is on image-right in MRI viewer

ihc:
  panels:
    A:
      vsi_dir: null            # TODO: folder of 8 section .vsi files
      vsi_files: []            # TODO: explicit .vsi paths to process
      overview_vsi: null       # TODO: overview image if present
      # EXACT channel index -> marker. ORDER UNCONFIRMED; confirm in QuPath/Bio-Formats.
      channel_map:
        0: null                # e.g. "DAPI"
        1: null                # e.g. "IgG-FITC"
        2: null                # e.g. "NeuroTrace"
        3: null                # e.g. "Podocalyxin"
      neurotrace_emission: null
      igg_fitc_channel_index: null
      igg_fitc_positive_threshold: null  # TODO: tune/confirm; overrides global if set
      fitc_spectral_bleedthrough: null   # Panel A: pending until NeuroTrace emission is confirmed
    B:
      vsi_dir: null
      vsi_files: []
      overview_vsi: null
      channel_map:
        0: null                # e.g. "DAPI"
        1: null                # e.g. "IBA1"
        2: null                # e.g. "GFAP"
        3: null                # e.g. "IgG-FITC"
      igg_fitc_channel_index: null
      igg_fitc_positive_threshold: null
      fitc_spectral_bleedthrough: null

interpretation_flags:
  anti_igg_specificity_resolved: null
  fitc_specific_to_lys241: null # true/false/null. Null means interpretation unresolved.
  specificity_source: null
  fitc_igg_specificity: null    # e.g. "anti_human_confirmed"
