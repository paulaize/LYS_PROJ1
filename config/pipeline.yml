# Global pipeline parameters. Per-animal facts live in config/animals/<id>.yml.
# Anything marked TODO/null must be set by Paul before the dependent stage is trusted.

project:
  name: "LYS_PROJ1"
  phase: "v1"
  environment: "lys-bbb"

version: "0.2.0-v1-merged"

paths:
  data_root: "data"
  work_root: "work"
  outputs_root: "outputs"

mri:
  expected_spacing_mm: [0.07, 0.07, 0.5]
  spacing_tolerance: 0.02

  lesion_scan:
    scan_number: 2
    sequence: "T2_haute_resolution_Turbo"

  optional_scans:
    t2star_scan_number: 3
    tof_scan_number: 4

  n4:
    enabled: true

  brain_mask:
    method: "otsu_morphology"

  segment:
    method: "threshold"
    k: 2.5
    min_lesion_mm3: 0.5

  edema:
    method: "swanson"

  edit:
    editor: "napari"
    reviewer: "Paul-Andréas"
    require_human_review: true

  dl:
    enabled: false
    model: "an2023"
    weights_path: null

ihc:
  # /Applications/QuPath.app/Contents/MacOS/QuPath
  qupath_executable: "/Applications/QuPath-0.7.0-arm64.app/Contents/MacOS/QuPath-0.7.0-arm64"

  vsi_pixel_size_um: 0.325
  default_downsample: 8.0

  dapi_channel_name: "DAPI"
  fitc_marker_name: "IgG-FITC"
  fitc_interpretation: "igg_fitc_signal_not_direct_lys241_concentration"

  # Keep null until tuned visually/experimentally in QuPath.
  # Do not use QuPath brightness/contrast max as the analysis threshold.
  igg_fitc_positive_threshold: null

  default_igg_fitc_channel_index: 1

compartments:
  # Milestone 4, unused in v1.
  peri_ring_mm: null

qc:
  require_human_mask_review: true
  flag_core_igg_fitc_confounded: true
  small_24h_lesion_warning_mm3: 6.0