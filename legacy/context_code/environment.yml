name: lys-bbb
channels:
  - conda-forge
dependencies:
  - python=3.11
  
  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  
  # Medical imaging I/O
  - nibabel          # NIfTI read/write
  - pydicom          # DICOM, if you ever need it
  - simpleitk        # filtering, registration, resampling
  
  # Image processing
  - scikit-image
  - opencv
  
  # Modeling & fitting
  - lmfit            # nonlinear curve fitting for PK models
  - scikit-learn
  
  # Interactive work
  - jupyterlab
  - ipywidgets
  - tqdm             # progress bars
  
  # Visualization (3D)
  - napari
  - pyqt             # napari backend
  
  # Dev tools
  - black            # code formatter
  - pip
  
  # Pip-only packages
  - pip:
    - brkraw                # Bruker → NIfTI conversion
    - antspyx               # ANTs registration (best-in-class)
    - itk                   # extra image filters
